{{- if and (ne (include "qmux.configSource" .) "existing") (eq (include "qmux.configResourceKind" .) "Secret") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qmux.configResourceName" . | quote }}
  labels:
    {{- include "qmux.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "qmux.generatedConfig" . | nindent 4 }}
{{- end }}
