{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" (include "qmux.fullname" .) }}
  labels:
    {{- include "qmux.labels" . | nindent 4 }}
    {{- with .Values.monitoring.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ printf "qmux-%s.json" .Values.mode }}: |
    {{- .Files.Get (printf "dashboards/%s.json" .Values.mode) | nindent 4 }}
{{- end }}
