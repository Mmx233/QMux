mode: client

config:
  client:
    server:
      servers:
        - address: qmux-server-headless:8443
          server_name: qmux-server-headless
    local:
      host: echo-backend
      port: 8080
    auth:
      method: mtls

tls:
  existingSecret:
    name: qmux-client-tls

monitoring:
  enabled: true
  prometheusAnnotations:
    enabled: true
  dashboard:
    enabled: true
