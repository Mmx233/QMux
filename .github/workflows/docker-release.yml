name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

jobs:
  validate-manual-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate application tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "Docker release tags must start with v" >&2; exit 1 ;;
          esac

  build-and-push:
    needs: validate-manual-tag
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && needs.validate-manual-tag.result == 'success') ||
       (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Login to Registry
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$password" | ko login docker.io -u "$username" --password-stdin

      - name: Build and Push
        env:
          KO_DOCKER_REPO: ${{ vars.DOCKERHUB_REPO }}
          VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: ko build --sbom none --bare --tags "latest,$VERSION" .

  publish-chart:
    needs: build-and-push
    if: ${{ !cancelled() && needs.build-and-push.result == 'success' }}
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/helm-release.yml
    with:
      chart_ref: ${{ github.event.repository.default_branch }}
    secrets: inherit
