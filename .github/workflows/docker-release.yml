# Docker Release Workflow
# Builds and publishes cross-platform Docker images to Docker Hub using ko
# Triggers on release publish or manual dispatch

name: Docker Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Login to Registry
        env:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$password" | ko login docker.io -u "$username" --password-stdin

      - name: Build and Push
        env:
          KO_DOCKER_REPO: ${{ vars.DOCKERHUB_REPO }}
          VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        run: ko build --sbom none --bare --tags "latest,$VERSION" .
