name: Go Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks-quick:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Predictable short suite
        timeout-minutes: 5
        run: go test -short ./... -count=1 -timeout=3m

      - name: Core generation, lifecycle, and snapshot race tests
        timeout-minutes: 3
        run: >-
          go test -race ./server/pool ./client ./server
          -run '^(TestGenerationCurrentMutators|TestGenerationStaleMutatorsAreNoOps|TestGenerationConcurrentStaleCompletionsAreBounded|TestClientLifecycle|TestConnectionManagerStopJoinsBlockedPublication|TestSnapshotRequiresEveryRoute|TestSnapshotConcurrentHealthUpdates)$'
          -count=1 -timeout=2m

      - name: E2E restart and same-ID race smoke
        timeout-minutes: 2
        run: >-
          go test -race ./e2e
          -run '^(TestServerRestartReconnect_MTLS|TestClientReconnection_MTLS)$'
          -count=1 -timeout=110s

  checks-extended:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Predictable short suite
        timeout-minutes: 5
        run: go test -short ./... -count=1 -timeout=3m

      - name: Full non-E2E suite
        timeout-minutes: 10
        run: >-
          go test ./auth/... ./client/... ./cmd/... ./config/... ./protocol/... ./server/...
          -count=1 -timeout=8m

      # Allocation and wall-clock performance checks remain covered by the preceding non-race suite.
      - name: Full non-E2E race suite
        timeout-minutes: 20
        run: >-
          go test -race ./auth/... ./client/... ./cmd/... ./config/... ./protocol/... ./server/...
          -skip '^(TestCodecAllocationEfficiency_Property|TestPoolSelectOverheadRatio_Property|TestConcurrentPoolThroughput_Property|TestHealthUpdateEfficiency_Property)$'
          -count=1 -timeout=15m

      - name: Functional E2E fault matrix
        timeout-minutes: 6
        run: >-
          go test -race ./e2e
          -run '^(TestServerRestartReconnect_MTLS|TestClientReconnection_MTLS|TestClientAbruptDisconnect_MTLS)$'
          -count=1 -timeout=300s

  checks-benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Non-E2E benchmarks
        timeout-minutes: 10
        run: >-
          go test ./auth/... ./client/... ./cmd/... ./config/... ./protocol/... ./server/...
          -run '^$' -bench . -benchmem -count=1 -timeout=8m
