name: Go Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Predictable short suite
        timeout-minutes: 5
        run: go test -short ./... -count=1 -timeout=3m

      - name: Full non-E2E race suite
        timeout-minutes: 20
        run: >-
          go test -race ./auth/... ./client/... ./cmd/... ./config/... ./protocol/... ./server/...
          -count=1 -timeout=15m

      - name: Functional E2E fault matrix
        timeout-minutes: 6
        run: >-
          go test -race ./e2e
          -run '^(TestServerRestartReconnect_MTLS|TestClientReconnection_MTLS|TestClientAbruptDisconnect_MTLS)$'
          -count=1 -timeout=300s

  checks-benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Non-E2E benchmarks
        timeout-minutes: 10
        run: >-
          go test ./auth/... ./client/... ./cmd/... ./config/... ./protocol/... ./server/...
          -run '^$' -bench . -benchmem -count=1 -timeout=8m
